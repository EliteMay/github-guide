name: Validate Project Guide

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/projects.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('project-meta.json','utf8'))"

      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data/projects.json
          test -f 404.html
          test -f README.md
          test -f PROJECT_LEARNINGS.md

      - name: Reject template placeholders
        run: |
          if grep -R "OWNER/REPOSITORY" --exclude-dir=.git .; then
            echo "Template placeholder remains"
            exit 1
          fi
