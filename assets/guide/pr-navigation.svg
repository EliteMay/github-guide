<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610"><rect width="1100" height="610" fill="#f6f8fa"/><rect x="42" y="36" width="1016" height="536" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="72" y="83" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#1f2328">Pull Request：どこを見る？</text><text x="72" y="116" font-family="Segoe UI, sans-serif" font-size="15" fill="#636c76">PRを開いた後は上部の4つのタブを使い分ける</text><g font-family="Segoe UI, sans-serif"><rect x="72" y="164" width="210" height="64" rx="10" fill="#ddf4ff" stroke="#54aeff"/><text x="118" y="203" font-size="19" font-weight="700" fill="#0550ae">Conversation</text><rect x="300" y="164" width="210" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="368" y="203" font-size="19" font-weight="700" fill="#1f2328">Commits</text><rect x="528" y="164" width="210" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="600" y="203" font-size="19" font-weight="700" fill="#1f2328">Checks</text><rect x="756" y="164" width="274" height="64" rx="10" fill="#fff8c5" stroke="#bf8700"/><text x="825" y="203" font-size="19" font-weight="700" fill="#7d4e00">Files changed</text></g><g font-family="Segoe UI, sans-serif" font-size="16" fill="#1f2328"><rect x="72" y="258" width="210" height="176" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="94" y="294" font-weight="700">Conversation</text><text x="94" y="326">• 説明・コメント</text><text x="94" y="356">• Merge可否</text><text x="94" y="386">• Deployment</text><text x="94" y="416">• Mergeボタン</text><rect x="300" y="258" width="210" height="176" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="322" y="294" font-weight="700">Commits</text><text x="322" y="326">• PR内の履歴</text><text x="322" y="356">• 誰がいつ変更</text><text x="322" y="386">• Commitを開く</text><rect x="528" y="258" width="210" height="176" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="550" y="294" font-weight="700">Checks</text><text x="550" y="326">• CI結果</text><text x="550" y="356">• 失敗Workflow</text><text x="550" y="386">• Details → Actions</text><rect x="756" y="258" width="274" height="176" rx="10" fill="#fff8c5" stroke="#bf8700"/><text x="778" y="294" font-weight="700" fill="#7d4e00">Files changed</text><text x="778" y="326">• 実際の差分</text><text x="778" y="356">• + 緑 / - 赤</text><text x="778" y="386">• 不要変更の確認</text><text x="778" y="416">• 行コメント</text></g><rect x="72" y="462" width="958" height="66" rx="10" fill="#dafbe1" stroke="#2da44e"/><text x="96" y="490" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1a7f37">Merge後のBranch削除</text><text x="96" y="514" font-family="Segoe UI, sans-serif" font-size="15" fill="#1f2328">Conversation下部の Delete branch、または Code → Branch dropdown → View all branches から管理</text><text x="72" y="553" font-family="Segoe UI, sans-serif" font-size="14" fill="#636c76">迷ったら「コード差分＝Files changed」「CI＝Checks」と覚える。</text></svg>