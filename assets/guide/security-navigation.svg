<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610"><rect width="1100" height="610" fill="#f6f8fa"/><rect x="42" y="36" width="1016" height="536" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="72" y="83" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#1f2328">Security：警告はどこにある？</text><text x="72" y="116" font-family="Segoe UI, sans-serif" font-size="15" fill="#636c76">見る場所と、機能を有効化する場所は別</text><g font-family="Segoe UI, sans-serif"><rect x="72" y="160" width="430" height="334" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="100" y="198" font-size="21" font-weight="700" fill="#1f2328">警告を見る</text><rect x="100" y="224" width="360" height="56" rx="8" fill="#ddf4ff" stroke="#54aeff"/><text x="136" y="259" font-size="18" font-weight="700" fill="#0550ae">Security and quality</text><text x="112" y="320" font-size="17" fill="#1f2328">Findings / Alerts から:</text><text x="130" y="356" font-size="16" fill="#1f2328">• Dependabot → Vulnerabilities</text><text x="130" y="390" font-size="16" fill="#1f2328">• Secret scanning alerts</text><text x="130" y="424" font-size="16" fill="#1f2328">• Code scanning alerts</text><text x="130" y="458" font-size="16" fill="#1f2328">• Security overview（表示される場合）</text><rect x="548" y="160" width="482" height="334" rx="12" fill="#fff8c5" stroke="#bf8700"/><text x="576" y="198" font-size="21" font-weight="700" fill="#7d4e00">設定する</text><rect x="576" y="224" width="426" height="56" rx="8" fill="#fff" stroke="#d0d7de"/><text x="618" y="259" font-size="18" font-weight="700" fill="#1f2328">Settings → Advanced Security</text><text x="590" y="320" font-size="17" fill="#1f2328">ここで確認するもの:</text><text x="608" y="356" font-size="16" fill="#1f2328">• Dependabot alerts / updates</text><text x="608" y="390" font-size="16" fill="#1f2328">• Secret scanning</text><text x="608" y="424" font-size="16" fill="#1f2328">• Code scanning / CodeQL</text><text x="608" y="458" font-size="16" fill="#1f2328">• Security機能の有効 / 無効</text></g><rect x="72" y="516" width="958" height="36" rx="8" fill="#ffebe9"/><text x="92" y="540" font-family="Segoe UI, sans-serif" font-size="15" fill="#a40e26">Secretが漏れた疑いがある場合は、GitHub上から消すだけでなく、元サービス側でToken / Keyを無効化・再発行する。</text></svg>