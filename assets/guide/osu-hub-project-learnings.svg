<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">osu-hub の PROJECT_LEARNINGS.md を開く場所</title>
  <desc id="desc">GitHub の osu-hub Repository で Code タブから PROJECT_LEARNINGS.md を選ぶ流れを示す図</desc>
  <rect width="1200" height="640" fill="#f6f8fa"/>
  <rect x="54" y="48" width="1092" height="544" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="86" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#1f2328">EliteMay / osu-hub</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#1f2328">
    <rect x="78" y="120" width="88" height="44" rx="6" fill="#ddf4ff"/>
    <text x="100" y="148" font-weight="700" fill="#0969da">Code</text>
    <text x="198" y="148">Issues</text>
    <text x="282" y="148">Pull requests</text>
    <text x="424" y="148">Actions</text>
    <text x="520" y="148">Projects</text>
    <text x="620" y="148">Settings</text>
  </g>
  <line x1="78" y1="177" x2="1118" y2="177" stroke="#d0d7de" stroke-width="2"/>
  <text x="92" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#636c76">main</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="18" fill="#1f2328">
    <rect x="82" y="244" width="1028" height="54" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="108" y="278">.github/</text>
    <rect x="82" y="298" width="1028" height="54" fill="#ffffff" stroke="#d0d7de"/>
    <text x="108" y="332">src/</text>
    <rect x="82" y="352" width="1028" height="62" rx="5" fill="#fff8c5" stroke="#bf8700" stroke-width="3"/>
    <text x="108" y="391" font-weight="700">PROJECT_LEARNINGS.md</text>
    <rect x="82" y="414" width="1028" height="54" fill="#ffffff" stroke="#d0d7de"/>
    <text x="108" y="448">README.md</text>
  </g>
  <path d="M 1006 520 C 955 470, 900 430, 820 389" fill="none" stroke="#cf222e" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="838" y="488" width="260" height="64" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="858" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#cf222e">ここを開く</text>
  <text x="858" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#1f2328">過去の失敗・学びの正本</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#cf222e"/></marker></defs>
</svg>