  <text x="106" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#636c76">osu! Hubで発生した再発防止価値の高い失敗と成功パターン</text>
  <rect x="98" y="190" width="1000" height="66" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="3"/>
  <text x="120" y="233" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#1f2328">## Failure</text>
