    <rect x="100" y="280" width="996" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="122" y="310" font-size="18" font-weight="700" fill="#cf222e">PL-F-001</text>
    <text x="236" y="310" font-size="18" font-weight="700" fill="#1f2328">Windows Core Audio COM IIDの転記ミス</text>
    <text x="122" y="337" font-size="15" fill="#636c76">症状 / 原因 / 修正 / 再発防止 / 関連PR</text>
    <rect x="100" y="364" width="996" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="122" y="394" font-size="18" font-weight="700" fill="#cf222e">PL-F-002</text>
    <text x="236" y="394" font-size="18" font-weight="700" fill="#1f2328">切替成功と確認成功を別に扱う</text>
    <text x="122" y="421" font-size="15" fill="#636c76">Expected / Actual / Root Cause / Final Fix</text>
    <rect x="100" y="448" width="996" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="122" y="478" font-size="18" font-weight="700" fill="#cf222e">PL-F-003〜005</text>
