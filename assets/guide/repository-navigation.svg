<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#f6f8fa"/><rect x="40" y="36" width="1020" height="548" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="70" y="82" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#1f2328">Repository 画面：場所の見つけ方</text><text x="70" y="114" font-family="Segoe UI, sans-serif" font-size="15" fill="#636c76">上のタブと右側の情報欄から、多くの機能へ移動する</text><g font-family="Segoe UI, sans-serif" font-size="18" font-weight="600"><rect x="70" y="150" width="120" height="48" rx="7" fill="#ddf4ff" stroke="#54aeff"/><text x="103" y="181" fill="#0550ae">Code</text><rect x="204" y="150" width="120" height="48" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="231" y="181" fill="#1f2328">Issues</text><rect x="338" y="150" width="155" height="48" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="361" y="181" fill="#1f2328">Pull requests</text><rect x="507" y="150" width="120" height="48" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="533" y="181" fill="#1f2328">Actions</text><rect x="641" y="150" width="120" height="48" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="664" y="181" fill="#1f2328">Security</text><rect x="775" y="150" width="120" height="48" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text x="794" y="181" fill="#1f2328">Insights</text><rect x="909" y="150" width="120" height="48" rx="7" fill="#fff8c5" stroke="#bf8700"/><text x="926" y="181" fill="#7d4e00">Settings</text></g><rect x="70" y="236" width="650" height="286" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="98" y="275" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Code の中</text><g font-family="Segoe UI, sans-serif" font-size="17" fill="#1f2328"><text x="100" y="320">• Branch dropdown → View all branches</text><text x="100" y="360">• Commits → 変更履歴・差分</text><text x="100" y="400">• ファイル一覧 → README / PROJECT_LEARNINGS.md</text><text x="100" y="440">• Code ボタン → Clone / Download ZIP</text><text x="100" y="480">• 右側の Releases → 完成版・exe</text></g><rect x="750" y="236" width="279" height="286" rx="10" fill="#fff" stroke="#d0d7de"/><text x="778" y="275" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1f2328">右側によくあるもの</text><g font-family="Segoe UI, sans-serif" font-size="17" fill="#1f2328"><text x="780" y="320">Releases</text><text x="780" y="358">Deployments / Environments</text><text x="780" y="396">Packages</text><text x="780" y="434">About / Website</text><text x="780" y="472">Languages</text></g><text x="70" y="560" font-family="Segoe UI, sans-serif" font-size="14" fill="#636c76">※ GitHubのUI名称・配置は更新で変わることがあります。迷ったら役割名で探す。</text></svg>