<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610"><rect width="1100" height="610" fill="#f6f8fa"/><rect x="42" y="36" width="1016" height="536" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/><text x="72" y="83" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#1f2328">Actions：失敗・Artifact・ログの場所</text><text x="72" y="116" font-family="Segoe UI, sans-serif" font-size="15" fill="#636c76">原因を探すときは左から順に深掘りする</text><g font-family="Segoe UI, sans-serif"><rect x="72" y="166" width="160" height="74" rx="10" fill="#ddf4ff" stroke="#54aeff"/><text x="118" y="198" font-size="19" font-weight="700" fill="#0550ae">Actions</text><text x="96" y="224" font-size="14" fill="#1f2328">上部タブ</text><path d="M238 203h58" stroke="#8c959f" stroke-width="4" marker-end="url(#a)"/><rect x="306" y="166" width="160" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="344" y="198" font-size="19" font-weight="700" fill="#1f2328">Workflow</text><text x="335" y="224" font-size="14" fill="#636c76">左の一覧</text><path d="M472 203h58" stroke="#8c959f" stroke-width="4" marker-end="url(#a)"/><rect x="540" y="166" width="160" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="589" y="198" font-size="19" font-weight="700" fill="#1f2328">Run</text><text x="565" y="224" font-size="14" fill="#636c76">1回の実行</text><path d="M706 203h58" stroke="#8c959f" stroke-width="4" marker-end="url(#a)"/><rect x="774" y="166" width="160" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="827" y="198" font-size="19" font-weight="700" fill="#1f2328">Job</text><text x="801" y="224" font-size="14" fill="#636c76">build / test 等</text><path d="M854 246v48" stroke="#8c959f" stroke-width="4" marker-end="url(#a)"/><rect x="774" y="306" width="160" height="74" rx="10" fill="#ffebe9" stroke="#cf222e"/><text x="823" y="338" font-size="19" font-weight="700" fill="#a40e26">Step</text><text x="798" y="364" font-size="14" fill="#1f2328">赤い所のログ</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#8c959f"/></marker></defs><rect x="72" y="304" width="620" height="202" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="100" y="342" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#1f2328">Runページで探すもの</text><g font-family="Segoe UI, sans-serif" font-size="17" fill="#1f2328"><text x="100" y="382">• 赤い Job / Step → 失敗原因</text><text x="100" y="420">• Artifacts → Setup.exe / ZIP / テスト成果物</text><text x="100" y="458">• Re-run jobs → 同じRunを再実行</text><text x="100" y="496">• Download log archive → ログ一式</text></g><rect x="730" y="410" width="260" height="96" rx="10" fill="#fff8c5" stroke="#bf8700"/><text x="755" y="444" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#7d4e00">重要</text><text x="755" y="474" font-family="Segoe UI, sans-serif" font-size="15" fill="#1f2328">最後の exit code より</text><text x="755" y="496" font-family="Segoe UI, sans-serif" font-size="15" fill="#1f2328">最初に赤くなったStepを見る</text><text x="72" y="548" font-family="Segoe UI, sans-serif" font-size="14" fill="#636c76">GitHub公式UIでも Actions → Workflow → Run → Job → Step の順でログを確認します。</text></svg>