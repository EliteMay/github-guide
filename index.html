<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitHubで公開しているプロジェクトのダウンロード、使い方、エラー対処、設定用語をまとめたユーザー向けガイド。">
  <title>Project Guide</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Project Guide トップ">
      <span class="brand-mark" aria-hidden="true">PG</span>
      <span><strong>Project Guide</strong><small>ユーザー向けサポート</small></span>
    </a>
    <label class="search">
      <span class="sr-only">ガイド内検索</span>
      <input id="globalSearch" type="search" placeholder="エラー番号、英語表記、設定名を検索">
    </label>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="ガイドメニュー">
      <div class="project-picker">
        <label for="projectSelect">プロジェクト</label>
        <select id="projectSelect"></select>
      </div>
      <nav id="sideNav">
        <button data-section="overview" class="active">概要</button>
        <button data-section="download">ダウンロード</button>
        <button data-section="start">はじめ方</button>
        <button data-section="errors">エラー対処</button>
        <button data-section="settings">設定・用語</button>
        <button data-section="faq">FAQ</button>
        <button data-section="updates">更新情報</button>
      </nav>
      <div class="sidebar-note">
        <strong>困ったとき</strong>
        <p>表示された英語やエラー番号をそのまま検索すると見つけやすくなります。</p>
      </div>
    </aside>

    <main id="main" class="content" tabindex="-1">
      <div id="app" aria-live="polite">
        <div class="empty">ガイドを読み込んでいます…</div>
      </div>
    </main>
  </div>

  <footer>
    <span>Project Guide</span>
    <span id="footerUpdated"></span>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
